[project]
name = "hospital-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jaskaran Singh", email = "323jaskaransingh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-huggingface>=1.2.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
]

[project.scripts]
hospital-chatbot = "hospital_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
